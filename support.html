        "<li>En iPhone, si participas en los rankings, los pasos pueden enviarse con la app cerrada cuando iOS lo permite (como mucho, más o menos una vez por hora). No ocurre si cerraste la app deslizándola hacia arriba. En Android, los pasos solo se leen y envían con la app abierta. Lo más seguro es abrir la app.</li></ul>" },
      { id: "pet-away", q: "Mi mascota ha desaparecido (se fue de casa)", a:
        "<p>Si la barriga de tu mascota se queda en 0 durante <b>4 días</b> sin comer (unos 7 días sin nada de comida), se siente sola y se va a casa. «Salió un rato…» en la pantalla de Inicio es la señal. <b>Tus mascotas y tu Colección nunca se pierden.</b></p>" +
        "<p>Toca «Ir a buscarlo (1 comida)» en Inicio y tu mascota vuelve enseguida. ¿Te falta comida? Camina para conseguir más. Con las notificaciones activadas, te avisamos antes de que se vaya.</p>" }
    ]},
    { id: "rank", icon: "🏆", title: "Rankings y amigos", items: [
      { id: "rank-schedule", q: "¿Cuándo cierran y se confirman los rankings?", a:
        "<p>Los rankings semanales (Mundo, Liga, Amigos) comparan los pasos <b>del lunes 00:00 al domingo 23:59, hora de Japón (UTC+9)</b>. Al terminar el domingo pasan a ser «provisionales» y se <b>confirman 48 horas después, el miércoles a las 00:00 (hora de Japón)</b>. Si abres la app antes, se cuentan todos los pasos de esa semana.</p>" +
        "<p>Mientras son provisionales, las posiciones pueden cambiar cuando otras personas abren la app. Los premios (Paws para el top 10 del ranking mundial semanal) y los ascensos y descensos de liga se deciden al confirmarse la semana.</p>" +
        "<p>El ranking histórico nunca se reinicia. El total histórico se calcula con los registros semanales; las semanas en que no abriste la app cuentan hasta <b>4 semanas atrás</b> (las más antiguas sí cuentan en el total de la app, pero no en el ranking histórico).</p>" },
      { id: "rank-missing", q: "No salgo en el ranking, o mi posición o mis pasos no cuadran", a:
        "<p>Revisa lo siguiente.</p><ul>" +
        "<li><b>¿Te has unido?</b> Solo aparece quien se une. Únete desde la pantalla de Ranking y comprueba que «Unirme a los rankings» está activado en Ajustes.</li>" +
        "<li><b>¿Has abierto la app?</b> Los pasos se envían al abrir la app. Ábrela al menos una vez antes de que se confirme la semana (miércoles 00:00, hora de Japón).</li>" +
        "<li><b>¿Provisional o confirmado?</b> El lunes y el martes la semana anterior aún es provisional y las posiciones pueden moverse.</li>" +
        "<li><b>Pasos de antes de empezar</b>: los pasos y las semanas anteriores al día en que empezaste no entran en el ranking.</li>" +
        "<li><b>Datos de otro dispositivo</b>: si la app indica que estos datos se mostraban en los rankings desde otro dispositivo, este dispositivo no envía pasos, para que nadie aparezca dos veces. Si aún tienes el otro dispositivo, usa «Traspaso de datos» en Ajustes para seguir con la misma cuenta.</li>" +
        "<li><b>Nombre visible</b>: los nombres con palabras inapropiadas se sustituyen automáticamente.</li></ul>" +
        "<p>¿Sigue sin cuadrar? Escríbenos con tu código de amigo y la semana o pantalla donde lo notaste.</p>" },
      { id: "rank-optout", q: "No quiero que mi nombre ni mis pasos salgan en los rankings", a:
        "<p>Al unirte a los rankings, tu nombre, la mascota que camina contigo (nombre, aspecto, nivel) y tus pasos se muestran a todos los que ven los rankings. Tus amigos también ven la ciudad en la que está tu viaje (una ciudad del juego, no tu ubicación real).</p>" +
        "<p>Para no aparecer, desactiva «<b>Unirme a los rankings</b>» en Ajustes. Tu nombre y tus pasos dejan de mostrarse y se deja de enviar los pasos. <b>Tus registros se conservan</b> y puedes volver cuando quieras. Tus amigos siguen ahí (las semanas en pausa no tienen posición ni premios). Mientras estés en un grupo competitivo, solo se envían los pasos de esta semana para el ranking de ese grupo (solo lo ven sus miembros).</p>" +
        "<p v164>En la última versión (1.6.4), al unirte también puedes elegir «<b>Solo amigos (sin salir en los rankings)</b>». Tu nombre y tu mascota solo los ven tus amigos, y los amigos, las invitaciones, los regalos y los grupos siguen funcionando.</p>" +
        "<p>Puedes cambiar tu nombre cuando quieras en «Tu nombre» en Ajustes. Te recomendamos no usar tu nombre real.</p>" },
      { id: "invite", q: "¿Cómo funcionan los códigos y los premios por invitar?", a:
        "<p>Envía tu código de amigo con «Invitar con enlace» o «Invitar con una imagen» (código QR) en la pantalla Amigos.</p>" +
        "<h4>La persona invitada</h4><ul><li>Durante sus <b>primeros 14 días con la app, y una sola vez</b>, escribe tu código en «¿Quién te invitó?» de su pantalla Amigos y recibe <b>+150 Paws</b> al momento (en su Buzón).</li></ul>" +
        "<h4>Tú</h4><ul>" +
        "<li>Cuando tu amigo camina <b>3.000 pasos</b> y <b>vuelve a abrir la app otro día</b>, cuenta como «1 persona» y recibes <b>+300 Paws</b> en «Bono por invitar» del Buzón (recógelos en 60 días). Puedes seguir el progreso en «En camino» del Buzón.</li>" +
        "<li>Además, <b>+1.500 Paws por cada 5 personas</b> y bonos especiales en los hitos (50 personas +5.000 · cada 100 personas +30.000 · 1.000 personas +200.000).</li>" +
        "<li>Con 5, 10 y 30 personas se unen mascotas limitadas que solo se consiguen invitando (Maneki, Inari y Komamori).</li></ul>" +
        "<p class=\"note\">Cada persona solo puede ser invitada una vez (si os invitáis mutuamente cuenta una vez) · los premios cuentan hasta 20 personas al día · para evitar abusos, comprobamos con servicios de Apple/Google que la app y el dispositivo son auténticos. Los premios obtenidos de forma fraudulenta (p. ej. con varias cuentas) pueden anularse. Cifras de noviembre de 2026; las condiciones actuales se muestran en la app, en «Cómo invitar amigos».</p>" },
      { id: "names", q: "Alguien tiene un nombre ofensivo / Quiero denunciar o bloquear", a:
        "<p>Los nombres inapropiados se sustituyen automáticamente, pero si alguien te molesta:</p><ul>" +
        "<li><b>Denunciar</b>: elige «Denunciar» en el menú de esa persona en los rankings o en Amigos (en iPhone, desliza una fila del ranking hacia la izquierda o mantenla pulsada). Se abrirá un correo para nosotros. También puedes escribir directamente a <a href=\"mailto:yoshitetsugames21+report@gmail.com\">yoshitetsugames21+report@gmail.com</a>. Revisamos cada denuncia y eliminamos nombres cuando hace falta.</li>" +
        "<li><b>Ocultar / Bloquear</b>: la persona desaparece de tus pantallas (bloquear también la quita de tus amigos). Puedes deshacerlo en «Personas ocultas» de la pantalla de Ranking.</li></ul>" }
    ]},
    { id: "shop", icon: "🥚", title: "Paws, compras y anuncios", items: [
      { id: "restore", q: "Mi compra no aparece / ¿Cómo restauro mis compras?", a:
        "<p>Con buena conexión, toca «<b>Restaurar compras</b>» al final de la Tienda o de la pantalla de PawPass. Vuelven <b>PawPass y el Pase de temporada</b> comprados con la misma Cuenta de Apple (la misma cuenta de Google en Android).</p>" +
        "<p>Los <b>packs de Paws y de comida</b> comprados con dinero no se restauran así. Viajan con tus datos (iCloud en iPhone; código de traspaso en ambos) y se conservan aunque borres los datos (en iPhone, los packs comprados antes de la versión 1.5.0 no vuelven tras un borrado).</p>" +
        "<p>¿Se te cobró y no llegó nada? Escríbenos con la fecha y hora de la compra, el número de pedido del recibo de la tienda y tu código de amigo.</p>" },
      { id: "cancel-refund", q: "Cancelar PawPass, reembolsos y compras de menores", a:
        "<h4>Cancelar</h4><p>PawPass (mensual, con renovación automática) se puede cancelar en cualquier momento: en iPhone desde «Suscripciones» del App Store y en Android desde «Suscripciones» de Google Play (mientras estés suscrito, también desde «Gestionar suscripción» en la pantalla de PawPass). Borrar la app no cancela la suscripción.</p>" +
        "<h4>Reembolsos</h4><p>Los pagos los gestiona Apple o Google, así que los reembolsos se piden a la tienda: en iPhone en <a href=\"https://reportaproblem.apple.com/\" rel=\"noopener\">reportaproblem.apple.com</a> y en Android desde tu historial de pedidos de Google Play. Nunca recibimos datos de pago como números de tarjeta.</p>" +
        "<h4>Menores</h4><p>Puedes bloquear las compras con «Solicitar la compra» de Tiempo de uso en iPhone, o con la autenticación de compras y el control parental de Google Play en Android.</p>" },
      { id: "gacha", q: "¿Qué probabilidades tiene el Gacha de huevos?", a:
        "<p>Abre «Gacha de huevos» desde Inicio: cada huevo muestra sus «<b>Probabilidades (por huevo)</b>», así que puedes verlas siempre antes de abrirlo. También indica cuántos huevos faltan para un ★4+ o un ★5 asegurado.</p>" +
        "<p>Las probabilidades son iguales para todos y no cambian con PawPass.</p>" },
      { id: "ads", q: "¿Tengo que ver anuncios?", a:
        "<p>No: puedes jugar a todo sin ellos. Los anuncios solo se reproducen <b>cuando tú tocas un botón de «mira un video y recibe un premio»</b>, como «Huevo gratis de hoy» o pedir una especialidad local. Con PawPass recibes los mismos premios sin anuncios (los límites diarios no cambian).</p>" +
        "<p>Los anuncios los sirve Unity (Unity LevelPlay / Unity Ads). No pedimos permiso de rastreo (ATT) y los datos de salud nunca se usan para anuncios. En el EEE, el Reino Unido y Suiza pedimos tu consentimiento antes de mostrar anuncios personalizados.</p>" }
    ]},
    { id: "data", icon: "📱", title: "Datos y traspaso", items: [
      { id: "new-phone", q: "¿Qué pasa con mis datos si cambio de teléfono o reinstalo?", a:
        "<h4>iPhone → iPhone</h4><p>Si has iniciado sesión en iCloud con la misma Cuenta de Apple, tus datos se guardan en iCloud automáticamente y vuelven en el nuevo iPhone o al reinstalar. Por si acaso, conviene crear también un código de traspaso.</p>" +
        "<h4>Android → Android</h4><p>Los datos <b>no se pasan automáticamente</b> (a veces vuelven con la copia de seguridad de Google, pero no es seguro). Antes de cambiar de teléfono o reinstalar, crea siempre un código de traspaso y apúntalo junto con la clave.</p>" +
        "<h4>iPhone ⇄ Android (código de traspaso)</h4><ol>" +
        "<li>En tu teléfono actual, ve a Ajustes → «Traspaso de datos» → «Crear código de traspaso» y elige una clave (<b>4 cifras</b>).</li>" +
        "<li>Apunta el código de traspaso que aparece (<b>12 caracteres</b>) y la clave.</li>" +
        "<li>Instala la app en el nuevo teléfono y escríbelos en Ajustes → «Traspaso de datos» → «Recuperar con un código».</li></ol>" +
        "<p>Se pasan tus mascotas, tu Colección, objetos, Paws, viaje y registros de pasos, además de tus registros de ranking y tus amigos. <b>PawPass y el Pase de temporada son compras de cada tienda</b>, así que no pasan entre iPhone y Android (en la misma tienda, usa «Restaurar compras»). Los datos que ya había en el nuevo teléfono se guardan como copia; durante 14 días puedes volver a ellos con «Recuperar los datos de antes del traspaso» en Ajustes.</p>" },
      { id: "lost-code", q: "He perdido el código de traspaso o la clave", a:
        "<p>Tu código y tu clave siempre se muestran en el teléfono que los creó, en Ajustes, en «Traspaso de datos» (toca el botón del ojo para ver la clave). Revisa allí primero.</p>" +
        "<p>Sin ese teléfono, el código y la clave no se pueden consultar ni volver a crear. La clave se guarda cifrada, así que ni siquiera nosotros podemos verla. Entre iPhone con la misma Cuenta de Apple, iCloud pasa tus datos aunque no tengas código.</p>" +
        "<p>Si fallas la clave 10 veces seguidas, no podrás introducirla durante 1 hora.</p>" },
      { id: "data-lost", q: "Mis datos han desaparecido / Quiero volver atrás", a:
        "<ul>" +
        "<li><b>Borraste los datos por error</b>: durante 14 días, usa «Deshacer borrado» en «Datos» de Ajustes. Antes de cambiar, compararás los datos actuales con la copia.</li>" +
        "<li><b>Un traspaso sobrescribió tus datos</b>: durante 14 días, usa «Recuperar los datos de antes del traspaso» en Ajustes.</li>" +
        "<li><b>Reinstalaste o tienes un iPhone nuevo</b>: comprueba que has iniciado sesión en iCloud con la misma Cuenta de Apple. Si tu familia comparte una Cuenta de Apple, puede aparecer «Hay otros datos en iCloud». Cambiar no borra tus datos actuales y puedes volver durante 14 días.</li>" +
        "<li><b>Reinstalaste en Android</b>: si tienes un código de traspaso, usa «Recuperar con un código».</li>" +
        "<li><b>No está tu mascota</b>: puede que solo se haya ido de casa (mira «Mi mascota ha desaparecido»).</li></ul>" +
        "<p>¿Nada de esto? Escríbenos con tu código de amigo (y el de traspaso, si lo tienes) y lo revisaremos.</p>" },
      { id: "delete", q: "¿Cómo borro mi cuenta o mis datos?", a:
        "<p>PawPlanet no tiene registro de usuario. Para borrar datos hay dos pasos.</p><ol>" +
        "<li><b>Borrar en la app</b>: Ajustes → «Datos» → «Borrar datos» elimina los datos guardados en tu dispositivo (mascotas, Paws, registros del viaje) y te pasa a una nueva cuenta anónima. Los datos anteriores se quedan 14 días en el dispositivo como copia. En iPhone, las claves de la cuenta permanecen en el Llavero aunque borres la app, y al reinstalar vuelves a la misma cuenta (las copias de iCloud se pueden borrar en los ajustes de iCloud del iPhone).</li>" +
        "<li><b>Pedirnos que borremos los datos del servidor</b>: para borrar los datos guardados en nuestro servidor (nombre visible, pasos, código de amigo, datos de traspaso, etc.), escríbenos con tu <b>código de amigo o código de traspaso</b>. Los borramos <b>en un plazo de 30 días</b>. No hace falta nombre ni correo.</li></ol>" +
        "<p>Borrar la app no cancela PawPass (mira «Cancelar PawPass»).</p>" }
    ]},
    { id: "other", icon: "🔒", title: "Privacidad y más", items: [
      { id: "privacy", q: "¿Qué información se envía y qué no?", a:
        "<h4>Lo que no recogemos</h4><p>Ni nombre, ni correo, ni teléfono, ni ubicación precisa (GPS), ni contactos. El inicio de sesión es anónimo y no hay registro. No guardamos recorridos, ubicaciones ni el nombre de los dispositivos que contaron tus pasos, y los pasos nunca se usan para publicidad ni análisis.</p>" +
        "<h4>Lo que se envía si te unes a los rankings o amigos</h4><p>Tu nombre visible, el nombre, aspecto y nivel de tu mascota, el aspecto de tu jardín, insignias, pasos de esta semana, de la anterior y totales, los pasos de hoy, puntos y posiciones, la ciudad del juego en la que estás (no tu ubicación real), código de amigo, estado de PawPass, registros de amigos, grupos, regalos e invitaciones, y las fechas en que abres la app (se borran a los 400 días), vinculados a un ID anónimo. Para que los rankings sean justos, solo en días con muchísimos pasos y casos parecidos, podemos enviar el total de ese día, los pasos de tu hora con más actividad y los pasos introducidos a mano.</p>" +
        "<h4>Otros</h4><p>Al crear un código de traspaso se guardan todos tus datos de juego (se borran un año después de la última actualización); el formulario de opiniones guarda tu mensaje con la versión de la app y del sistema y el modelo del teléfono. Para evitar abusos en las invitaciones, comprobamos con Apple/Google que la app y el dispositivo son auténticos y guardamos el resultado. Cuando ves un anuncio, se envían identificadores del dispositivo y datos similares al proveedor de anuncios (Unity).</p>" +
        "<p>Más detalles en la <a class=\"js-privacy\" href=\"privacy.html\">Política de privacidad</a> (en inglés).</p>" },
      { id: "notifications", q: "¿Cómo desactivo las notificaciones? / No me llegan", a:
        "<p>Enviamos notificaciones como recordatorios de cuidado, un aviso cuando tu mascota está a punto de irse y un recordatorio si llevas tiempo sin abrir la app. La app funciona sin ellas.</p>" +
        "<p>Para desactivarlas, apaga «Notificaciones» en «General» de los Ajustes de la app (también puedes hacerlo en los Ajustes del teléfono). ¿No te llegan? Comprueba que «Notificaciones» está activado en la app y que PawPlanet tiene permiso para enviar notificaciones en los Ajustes del teléfono.</p>" },
      { id: "android", q: "¿Hay versión para Android? ¿En qué se diferencia?", a:
        "<p>Sí. Descárgala en <a href=\"https://play.google.com/store/apps/details?id=com.pawplanet.app\" rel=\"noopener\">Google Play</a> (Android 8.0 o posterior). La versión para iPhone está en el <a href=\"https://apps.apple.com/app/id6808814090\" rel=\"noopener\">App Store</a> (iOS 16 o posterior).</p>" +
        "<p>Los rankings y los amigos son comunes a iPhone y Android, así que puedes jugar con amigos de cualquiera de los dos. Las principales diferencias:</p><ul>" +
        "<li>Origen de los pasos: Salud y el podómetro del iPhone en iPhone; Health Connect y el podómetro del móvil en Android.</li>" +
        "<li>Guardado: el iPhone guarda en iCloud automáticamente; Android no pasa los datos solo, así que crea un código de traspaso antes de cambiar de teléfono.</li>" +
        "<li>Envío de pasos: en Android, los pasos solo se leen y envían con la app abierta.</li>" +
        "<li>Compras: App Store en iPhone y Google Play en Android. PawPass no pasa de uno a otro.</li></ul>" },
      { id: "contact", q: "¿Cómo puedo contactar con vosotros?", a:
        "<p>Usa «<b>Opiniones y errores</b>» en los Ajustes de la app. Normalmente no podemos responder a cada mensaje, pero los leemos todos. Los avisos importantes pueden llegar a «Noticias del equipo» en tu Buzón.</p>" +
        "<p>Por correo: <a href=\"mailto:yoshitetsugames21@gmail.com\">yoshitetsugames21@gmail.com</a> (en japonés o en inglés). Si incluyes tu código de amigo, la versión de la app y el modelo del teléfono, podremos revisarlo antes. Las denuncias de otros usuarios también se aceptan en <a href=\"mailto:yoshitetsugames21+report@gmail.com\">yoshitetsugames21+report@gmail.com</a>.</p>" }
    ]}
  ]
};
</script>

  cats: [

        "<p>PawPlanet <b>liest</b> nur die Schritte, die auf deinem Handy aufgezeichnet sind. Die Schritte werden beim Öffnen der App aktualisiert.</p>" +

        "<li>In den Optionen der App sollte unter „Schritte (Health Connect)“ bei „Schrittzugriff“ „Liest Schritte“ stehen.</li></ol>" },
      { id: "steps-diff", q: "Meine Schritte weichen von Health ab oder kommen verspätet", a:
        "<ul>" +
        "<li>Die Schritte werden beim Öffnen der App gelesen (und regelmäßig, solange der Startbildschirm offen ist). Tage, an denen du die App nicht geöffnet hast, werden bis zu <b>14 Tage rückwirkend</b> übernommen.</li>" +

        "<li>Auf dem iPhone können die Schritte, wenn du bei den Ranglisten mitmachst, auch bei geschlossener App gesendet werden, sobald iOS es zulässt (höchstens etwa einmal pro Stunde). Das passiert nicht, wenn du die App nach oben weggewischt hast. Unter Android werden Schritte nur bei geöffneter App gelesen und gesendet. Am sichersten ist es, die App zu öffnen.</li></ul>" },
      { id: "pet-away", q: "Mein Tier ist weg (es ist ausgezogen)", a:
        "<p>Bleibt die Sattheit deines Tiers <b>4 Tage</b> lang ohne Futter auf 0 (etwa 7 Tage ganz ohne Futter), wird es einsam und geht nach Hause. Das Zeichen dafür ist „Mal weg …“ auf dem Startbildschirm. <b>Deine Tiere und dein Tierbuch gehen nie verloren.</b></p>" +
        "<p>Tippe auf dem Startbildschirm auf „Abholen (1× Futter)“, und dein Tier kommt sofort zurück. Zu wenig Futter? Geh spazieren und sammle neues. Mit aktivierten Mitteilungen warnen wir dich, bevor es geht.</p>" }
    ]},
    { id: "rank", icon: "🏆", title: "Ranglisten & Freunde", items: [
      { id: "rank-schedule", q: "Wann schließen die Ranglisten und wann sind sie endgültig?", a:
        "<p>Die Wochenranglisten (Welt, Liga, Freunde) vergleichen die Schritte von <b>Montag 00:00 bis Sonntag 23:59 japanischer Zeit (UTC+9)</b>. Am Ende des Sonntags werden sie „vorläufig“ und <b>48 Stunden später, am Mittwoch um 00:00 (japanische Zeit), endgültig</b>. Öffnest du die App bis dahin, zählen alle Schritte dieser Woche.</p>" +
        "<p>Solange sie vorläufig sind, können sich Plätze noch ändern, wenn andere die App öffnen. Belohnungen (Paw für die Top 10 der Wochen-Weltrangliste) sowie Auf- und Abstiege in der Liga werden festgelegt, wenn die Woche endgültig ist.</p>" +
        "<p>Die Allzeit-Rangliste wird nie zurückgesetzt. Die Allzeit-Summe entsteht aus den Wochenwerten; Wochen, in denen du die App nicht geöffnet hast, zählen bis zu <b>4 Wochen rückwirkend</b> (ältere Wochen zählen in der Summe in der App, aber nicht in der Allzeit-Rangliste).</p>" },
      { id: "rank-missing", q: "Ich stehe nicht in der Rangliste, oder Platz/Schritte stimmen nicht", a:
        "<p>Bitte prüfe Folgendes.</p><ul>" +
        "<li><b>Machst du mit?</b> Es erscheint nur, wer mitmacht. Tritt über den Ranglisten-Bildschirm bei und prüfe, ob „Bei Ranglisten mitmachen“ in den Optionen eingeschaltet ist.</li>" +
        "<li><b>Hast du die App geöffnet?</b> Schritte werden beim Öffnen der App gesendet. Öffne sie mindestens einmal, bevor die Woche endgültig wird (Mittwoch 00:00 japanischer Zeit).</li>" +
        "<li><b>Vorläufig oder endgültig?</b> Montags und dienstags ist die Vorwoche noch vorläufig, Plätze können sich verschieben.</li>" +
        "<li><b>Schritte von vor deinem Start</b>: Schritte und Wochen von vor dem Tag, an dem du angefangen hast, kommen nicht in die Rangliste.</li>" +
        "<li><b>Daten von einem anderen Gerät</b>: Zeigt die App an, dass diese Daten von einem anderen Gerät in den Ranglisten angezeigt wurden, sendet dieses Gerät keine Schritte – damit niemand doppelt erscheint. Wenn du das andere Gerät noch hast, nutze „Datenübertragung“ in den Optionen, um mit demselben Konto weiterzumachen.</li>" +
        "<li><b>Anzeigename</b>: Namen mit unangemessenen Wörtern werden automatisch ersetzt.</li></ul>" +
        "<p>Stimmt es immer noch nicht? Schreib uns mit deinem Freundescode und der Woche bzw. dem Bildschirm, wo es dir aufgefallen ist.</p>" },
      { id: "rank-optout", q: "Ich möchte meinen Namen oder meine Schritte nicht in der Rangliste zeigen", a:
        "<p>Wenn du mitmachst, sehen alle, die die Ranglisten ansehen, deinen Namen, das Tier, das mit dir läuft (Name, Aussehen, Level), und deine Schritte. Freunde sehen außerdem die Stadt, in der deine Reise gerade ist (eine Stadt im Spiel, nicht dein echter Standort).</p>" +
        "<p>Schalte dafür „<b>Bei Ranglisten mitmachen</b>“ in den Optionen aus. Name und Schritte erscheinen dann nicht mehr, und es werden keine Schritte mehr gesendet. <b>Deine Daten bleiben erhalten</b>, und du kannst jederzeit zurückkehren. Deine Freunde bleiben (Wochen in der Pause haben keinen Platz und keine Belohnungen). Solange du in einer Wettbewerbsgruppe bist, werden nur die Schritte dieser Woche für die Rangliste dieser Gruppe gesendet (nur für ihre Mitglieder sichtbar).</p>" +
        "<p v164>In der neuesten Version (1.6.4) kannst du beim Mitmachen auch „<b>Nur Freunde (nicht in den Ranglisten)</b>“ wählen. Name und Tier sehen dann nur deine Freunde, und Freunde, Einladungen, Geschenke und Gruppen funktionieren weiter.</p>" +
        "<p>Deinen Namen kannst du jederzeit unter „Dein Name“ in den Optionen ändern. Wir empfehlen, nicht deinen echten Namen zu verwenden.</p>" },
      { id: "invite", q: "Wie funktionieren Einladungscodes und Einladungsbelohnungen?", a:
        "<p>Schick deinen Freundescode mit „Per Link einladen“ oder „Freunde per Bild einladen“ (QR-Code) im Freunde-Bildschirm.</p>" +
        "<h4>Die eingeladene Person</h4><ul><li>Innerhalb der <b>ersten 14 Tage mit der App und nur einmal</b> gibt sie deinen Code im Freunde-Bildschirm bei „Wer hat dich eingeladen?“ ein und bekommt sofort <b>+150 Paw</b> (ins Postfach).</li></ul>" +
        "<h4>Du</h4><ul>" +
        "<li>Läuft dein Freund <b>3.000 Schritte</b> und <b>öffnet die App an einem späteren Tag erneut</b>, zählt er als „1 Person“, und <b>+300 Paw</b> kommen unter „Einladungsbonus“ in dein Postfach (innerhalb von 60 Tagen abholen). Den Fortschritt siehst du unter „Unterwegs“ im Postfach.</li>" +
        "<li>Dazu <b>+1.500 Paw für je 5 Personen</b> und Sonderboni an Meilensteinen (50 Personen +5.000 · je 100 Personen +30.000 · 1.000 Personen +200.000).</li>" +
        "<li>Bei 5, 10 und 30 Personen kommen Tiere dazu, die es nur über Einladungen gibt (Maneki, Inari, Komamori).</li></ul>" +
        "<p class=\"note\">Jede Person kann nur einmal eingeladen werden (gegenseitiges Einladen zählt einmal) · Belohnungen gibt es für bis zu 20 Personen pro Tag · um Missbrauch zu verhindern, prüfen wir mit Diensten von Apple/Google, ob App und Gerät echt sind. Unfair erhaltene Belohnungen (z. B. mit mehreren Konten) können zurückgenommen werden. Stand: November 2026; die aktuellen Regeln findest du in der App unter „So funktionieren Einladungen“.</p>" },
      { id: "names", q: "Jemand hat einen anstößigen Namen / Ich möchte melden oder blockieren", a:
        "<p>Unangemessene Namen werden automatisch ersetzt. Falls dich trotzdem jemand stört:</p><ul>" +
        "<li><b>Melden</b>: Wähle im Menü der Person in den Ranglisten oder bei Freunden „Melden“ (auf dem iPhone eine Ranglistenzeile nach links wischen oder lange drücken). Es öffnet sich eine E-Mail an uns. Du kannst auch direkt an <a href=\"mailto:yoshitetsugames21+report@gmail.com\">yoshitetsugames21+report@gmail.com</a> schreiben. Wir prüfen Meldungen und entfernen Namen bei Bedarf.</li>" +
        "<li><b>Ausblenden / Blockieren</b>: Die Person verschwindet von deinen Bildschirmen (Blockieren entfernt sie auch aus deinen Freunden). Rückgängig machen kannst du das unter „Ausgeblendete Personen“ im Ranglisten-Bildschirm.</li></ul>" }
    ]},
    { id: "shop", icon: "🥚", title: "Paw, Käufe & Werbung", items: [
      { id: "restore", q: "Mein Kauf ist nicht angekommen / Wie stelle ich Käufe wieder her?", a:
        "<p>Tippe bei guter Verbindung ganz unten im Shop oder unten im PawPass-Bildschirm auf „<b>Käufe wiederherstellen</b>“. <b>PawPass und Season Pass</b>, die mit demselben Apple Account (unter Android mit demselben Google-Konto) gekauft wurden, kommen zurück.</p>" +
        "<p>Mit Geld gekaufte <b>Paw- und Futterpakete</b> werden so nicht wiederhergestellt. Sie wandern mit deinen Daten mit (auf dem iPhone über iCloud, auf beiden per Übertragungscode) und bleiben auch nach dem Zurücksetzen erhalten (auf dem iPhone kommen vor Version 1.5.0 gekaufte Pakete nach einem Zurücksetzen nicht zurück).</p>" +
        "<p>Bezahlt, aber nichts angekommen? Schreib uns mit Datum und Uhrzeit des Kaufs, der Bestellnummer aus dem Store-Beleg und deinem Freundescode.</p>" },
      { id: "cancel-refund", q: "PawPass kündigen, Erstattungen und Käufe von Kindern", a:
        "<h4>Kündigen</h4><p>PawPass (monatlich, automatisch verlängernd) kannst du jederzeit kündigen: auf dem iPhone unter „Abonnements“ im App Store, unter Android unter „Abos“ in Google Play (während du Mitglied bist, auch über „Abo verwalten“ im PawPass-Bildschirm). Das Löschen der App kündigt das Abo nicht.</p>" +
        "<h4>Erstattungen</h4><p>Zahlungen wickeln Apple oder Google ab, daher beantragst du Erstattungen beim jeweiligen Store: auf dem iPhone unter <a href=\"https://reportaproblem.apple.com/\" rel=\"noopener\">reportaproblem.apple.com</a>, unter Android über deinen Bestellverlauf in Google Play. Zahlungsdaten wie Kartennummern erhalten wir nie.</p>" +
        "<h4>Kinder</h4><p>Käufe kannst du auf dem iPhone mit „Kaufanfrage“ in der Bildschirmzeit sperren, unter Android mit der Authentifizierung für Käufe und der Jugendschutzeinstellung von Google Play.</p>" },
      { id: "gacha", q: "Wie hoch sind die Chancen beim Ei-Gacha?", a:
        "<p>Öffne „Ei-Gacha“ vom Startbildschirm: Jedes Ei zeigt seine „<b>Chancen (pro Ei)</b>“, die du vor dem Öffnen jederzeit prüfen kannst. Außerdem siehst du, wie viele Eier es noch bis zu einem garantierten ★4+ oder ★5 sind.</p>" +
        "<p>Die Chancen sind für alle gleich und ändern sich mit PawPass nicht.</p>" },
      { id: "ads", q: "Muss ich Werbung ansehen?", a:
        "<p>Nein – du kannst alles ohne Werbung spielen. Werbung läuft nur, <b>wenn du selbst einen Button „Video ansehen für eine Belohnung“ tippst</b>, etwa beim „Gratis-Ei des Tages“ oder beim Bestellen einer Spezialität. Mit PawPass bekommst du dieselben Belohnungen ohne Werbung (Tageslimits bleiben gleich).</p>" +
        "<p>Die Werbung kommt von Unity (Unity LevelPlay / Unity Ads). Wir fragen nicht nach einer Tracking-Erlaubnis (ATT), und Gesundheitsdaten werden nie für Werbung genutzt. Im EWR, im Vereinigten Königreich und in der Schweiz fragen wir vor personalisierter Werbung nach deiner Einwilligung.</p>" }
    ]},
    { id: "data", icon: "📱", title: "Daten & Übertragung", items: [
      { id: "new-phone", q: "Was passiert mit meinen Daten bei einem neuen Handy oder einer Neuinstallation?", a:
        "<h4>iPhone → iPhone</h4><p>Bist du mit demselben Apple Account bei iCloud angemeldet, werden deine Daten automatisch in iCloud gesichert und kommen auf einem neuen iPhone oder nach einer Neuinstallation zurück. Zur Sicherheit lohnt sich zusätzlich ein Übertragungscode.</p>" +
        "<h4>Android → Android</h4><p>Die Daten werden <b>nicht automatisch übertragen</b> (eine Google-Sicherung stellt sie manchmal wieder her, aber nicht zuverlässig). Erstelle vor einem Handywechsel oder einer Neuinstallation immer einen Übertragungscode und notiere ihn zusammen mit der PIN.</p>" +
        "<h4>iPhone ⇄ Android (Übertragungscode)</h4><ol>" +
        "<li>Öffne auf deinem jetzigen Handy Optionen → „Datenübertragung“ → „Übertragungscode erstellen“ und wähle eine PIN (<b>4 Ziffern</b>).</li>" +
        "<li>Notiere den angezeigten Übertragungscode (<b>12 Zeichen</b>) und die PIN.</li>" +
        "<li>Installiere die App auf dem neuen Handy und gib beides unter Optionen → „Datenübertragung“ → „Mit Code wiederherstellen“ ein.</li></ol>" +
        "<p>Übertragen werden deine Tiere, das Tierbuch, Gegenstände, Paw, Reise und Schrittdaten sowie deine Ranglisten-Daten und Freunde. <b>PawPass und Season Pass gehören zum Store, in dem du sie gekauft hast</b>, und wandern daher nicht zwischen iPhone und Android (im selben Store hilft „Käufe wiederherstellen“). Daten, die schon auf dem neuen Handy waren, bleiben als Sicherung erhalten; innerhalb von 14 Tagen kommst du mit „Daten von vor der Übertragung wiederherstellen“ in den Optionen zurück.</p>" },
      { id: "lost-code", q: "Ich habe meinen Übertragungscode oder die PIN verloren", a:
        "<p>Code und PIN werden auf dem Handy, das sie erstellt hat, immer in den Optionen unter „Datenübertragung“ angezeigt (tippe auf das Auge, um die PIN zu zeigen). Bitte sieh zuerst dort nach.</p>" +
        "<p>Ohne dieses Handy können Code und PIN weder nachgeschlagen noch neu erstellt werden. Die PIN wird verschlüsselt gespeichert, sodass selbst wir sie nicht sehen können. Zwischen iPhones mit demselben Apple Account überträgt iCloud deine Daten auch ohne Code.</p>" +
        "<p>Nach 10 falschen PIN-Eingaben in Folge ist die Eingabe 1 Stunde lang gesperrt.</p>" },
      { id: "data-lost", q: "Meine Daten sind weg / Ich möchte zurück", a:
        "<ul>" +
        "<li><b>Versehentlich zurückgesetzt</b>: Innerhalb von 14 Tagen hilft „Zurücksetzen rückgängig machen“ unter „Daten“ in den Optionen. Du vergleichst vor dem Tausch die aktuellen Daten mit der Sicherung.</li>" +
        "<li><b>Eine Übertragung hat deine Daten überschrieben</b>: Innerhalb von 14 Tagen hilft „Daten von vor der Übertragung wiederherstellen“ in den Optionen.</li>" +
        "<li><b>Neu installiert oder neues iPhone</b>: Prüfe, ob du mit demselben Apple Account bei iCloud angemeldet bist. Nutzt deine Familie einen gemeinsamen Apple Account, kann „Andere Daten in iCloud gefunden“ erscheinen. Ein Wechsel löscht deine aktuellen Daten nicht, und du kannst 14 Tage lang zurückwechseln.</li>" +

        "<li><b>Dein Tier fehlt</b>: Vielleicht ist es nur ausgezogen (siehe „Mein Tier ist weg“).</li></ul>" +
        "<p>Nichts davon trifft zu? Schreib uns mit deinem Freundescode (und, falls vorhanden, dem Übertragungscode) – wir sehen nach.</p>" },
      { id: "delete", q: "Wie lösche ich mein Konto oder meine Daten?", a:
        "<p>PawPlanet hat keine Registrierung. Zum Löschen gibt es zwei Schritte.</p><ol>" +
        "<li><b>In der App zurücksetzen</b>: Optionen → „Daten“ → „Daten zurücksetzen“ löscht die Spieldaten auf deinem Gerät (Tiere, Paw, Reisedaten) und wechselt zu einem neuen anonymen Konto. Die vorherigen Daten bleiben 14 Tage als Sicherung auf dem Gerät. Auf dem iPhone bleiben die Kontoschlüssel auch nach dem Löschen der App im Schlüsselbund, und nach einer Neuinstallation bist du wieder im selben Konto (iCloud-Kopien kannst du in den iCloud-Einstellungen deines iPhone löschen).</li>" +
        "<li><b>Löschung der Serverdaten beantragen</b>: Um auf unserem Server gespeicherte Daten (Anzeigename, Schritte, Freundescode, Übertragungsdaten usw.) zu löschen, schreib uns mit deinem <b>Freundescode oder Übertragungscode</b>. Wir löschen sie <b>innerhalb von 30 Tagen</b>. Name oder E-Mail-Adresse sind nicht nötig.</li></ol>" +
        "<p>Das Löschen der App kündigt PawPass nicht (siehe „PawPass kündigen“).</p>" }
    ]},

      { id: "privacy", q: "Welche Daten werden gesendet – und welche nicht?", a:
        "<h4>Nicht erfasst</h4><p>Kein Name, keine E-Mail, keine Telefonnummer, kein genauer Standort (GPS), keine Kontakte. Die Anmeldung ist anonym, ein Konto gibt es nicht. Wir speichern keine Wege, Standorte oder Namen der Geräte, die deine Schritte gezählt haben, und Schritte werden nie für Werbung oder Analysen genutzt.</p>" +
        "<h4>Gesendet, wenn du bei Ranglisten/Freunden mitmachst</h4><p>Anzeigename, Name/Aussehen/Level deines Tiers, Aussehen deines Gartens, Abzeichen, Schritte dieser Woche, der Vorwoche und gesamt sowie heute, Punkte und Plätze, die Spielstadt, in der du bist (nicht dein echter Standort), Freundescode, PawPass-Status, Daten zu Freunden, Gruppen, Geschenken und Einladungen sowie die Tage, an denen du die App öffnest (nach 400 Tagen gelöscht) – verknüpft mit einer anonymen ID. Um die Ranglisten fair zu halten, können wir nur an Tagen mit ungewöhnlich vielen Schritten o. Ä. die Tagessumme, die Schritte deiner aktivsten Stunde und manuell eingetragene Schritte senden.</p>" +
        "<h4>Sonstiges</h4><p>Beim Erstellen eines Übertragungscodes speichern wir deine kompletten Spieldaten (ein Jahr nach der letzten Aktualisierung gelöscht); das Feedback-Formular speichert deine Nachricht mit App-/Systemversion und Handymodell. Um Missbrauch bei Einladungen zu verhindern, prüfen wir mit Apple/Google, ob App und Gerät echt sind, und speichern das Ergebnis. Beim Ansehen von Werbung werden Gerätekennungen und ähnliche Daten an den Werbeanbieter (Unity) gesendet.</p>" +
        "<p>Details in der <a class=\"js-privacy\" href=\"privacy.html\">Datenschutzerklärung</a> (auf Englisch).</p>" },
      { id: "notifications", q: "Wie schalte ich Mitteilungen aus? / Ich bekomme keine", a:
        "<p>Wir senden Mitteilungen wie Pflege-Erinnerungen, eine Warnung, wenn dein Tier bald auszieht, und einen Hinweis, wenn du die App länger nicht geöffnet hast. Die App funktioniert auch ohne.</p>" +
        "<p>Zum Ausschalten deaktiviere „Mitteilungen“ unter „Allgemein“ in den Optionen der App (oder in den Einstellungen deines Handys). Bekommst du keine? Prüfe, ob „Mitteilungen“ in der App an ist und PawPlanet in den Einstellungen deines Handys Mitteilungen senden darf.</p>" },
      { id: "android", q: "Gibt es eine Android-Version? Was ist anders?", a:
        "<p>Ja, bei <a href=\"https://play.google.com/store/apps/details?id=com.pawplanet.app\" rel=\"noopener\">Google Play</a> (Android 8.0 oder neuer). Die iPhone-Version gibt es im <a href=\"https://apps.apple.com/app/id6808814090\" rel=\"noopener\">App Store</a> (iOS 16 oder neuer).</p>" +
        "<p>Ranglisten und Freunde sind für iPhone und Android gemeinsam – du kannst also mit Freunden auf beiden Systemen spielen. Die wichtigsten Unterschiede:</p><ul>" +
        "<li>Schrittquelle: auf dem iPhone Health und der iPhone-Schrittzähler, unter Android Health Connect und der Schrittzähler des Handys.</li>" +
        "<li>Speichern: Das iPhone sichert automatisch in iCloud; unter Android werden Daten nicht automatisch übertragen – erstelle vor einem Handywechsel einen Übertragungscode.</li>" +
        "<li>Senden der Schritte: Unter Android werden Schritte nur bei geöffneter App gelesen und gesendet.</li>" +
        "<li>Käufe: App Store auf dem iPhone, Google Play unter Android. PawPass lässt sich nicht zwischen beiden übertragen.</li></ul>" },
      { id: "contact", q: "Wie erreiche ich euch?", a:
        "<p>Nutze „<b>Feedback &amp; Fehler melden</b>“ in den Optionen der App. Wir können meist nicht einzeln antworten, lesen aber jede Nachricht. Wichtige Hinweise kommen eventuell als „News vom Team“ in dein Postfach.</p>" +
        "<p>Per E-Mail: <a href=\"mailto:yoshitetsugames21@gmail.com\">yoshitetsugames21@gmail.com</a> (Japanisch oder Englisch). Mit Freundescode, App-Version und Handymodell können wir schneller nachsehen. Meldungen über andere Nutzer nehmen wir auch unter <a href=\"mailto:yoshitetsugames21+report@gmail.com\">yoshitetsugames21+report@gmail.com</a> entgegen.</p>" }
    ]}
  ]

        "<p>Les taux sont les mêmes pour tous et ne changent pas avec le PawPass.</p>" },
      { id: "ads", q: "Dois-je regarder des pubs ?", a:
        "<p>Non — tu peux tout faire sans elles. Les pubs ne se lancent <b>que si tu touches toi-même un bouton « regarder une vidéo pour une récompense »</b>, comme « Œuf gratuit du jour » ou la commande d'une spécialité locale. Avec le PawPass, tu reçois les mêmes récompenses sans pub (limites quotidiennes inchangées).</p>" +
        "<p>Les pubs sont diffusées par Unity (Unity LevelPlay / Unity Ads). Nous ne demandons pas l'autorisation de suivi (ATT) et les données de santé ne servent jamais à la publicité. Dans l'EEE, au Royaume-Uni et en Suisse, nous demandons ton consentement avant d'afficher des pubs personnalisées.</p>" }
    ]},
    { id: "data", icon: "📱", title: "Données et transfert", items: [
      { id: "new-phone", q: "Que deviennent mes données si je change de téléphone ou réinstalle ?", a:
        "<h4>iPhone → iPhone</h4><p>Si tu es connecté à iCloud avec le même compte Apple, tes données sont enregistrées automatiquement dans iCloud et reviennent sur un nouvel iPhone ou après une réinstallation. Par précaution, crée aussi un code de transfert.</p>" +
        "<h4>Android → Android</h4><p>Les données <b>ne sont pas transférées automatiquement</b> (une sauvegarde Google peut parfois les restaurer, mais ce n'est pas fiable). Avant de changer de téléphone ou de réinstaller, crée toujours un code de transfert et note-le avec le code secret.</p>" +
        "<h4>iPhone ⇄ Android (code de transfert)</h4><ol>" +
        "<li>Sur ton téléphone actuel, va dans Réglages → « Transfert de données » → « Créer un code de transfert » et choisis un code secret (<b>4 chiffres</b>).</li>" +
        "<li>Note le code de transfert affiché (<b>12 caractères</b>) et le code secret.</li>" +
        "<li>Installe l'app sur le nouveau téléphone et saisis-les dans Réglages → « Transfert de données » → « Restaurer avec un code ».</li></ol>" +
        "<p>Tes animaux, ton Carnet, tes objets, tes Paw, ton voyage et tes pas sont transférés, ainsi que tes données de classement et tes amis. <b>Le PawPass et le Pass Saison sont liés à la boutique</b> où tu les as achetés : ils ne passent donc pas d'iPhone à Android (dans la même boutique, utilise « Restaurer les achats »). Les données déjà présentes sur le nouveau téléphone sont gardées en sauvegarde ; pendant 14 jours, tu peux y revenir avec « Restaurer les données d'avant le transfert » dans les Réglages.</p>" },
      { id: "lost-code", q: "J'ai perdu mon code de transfert ou mon code secret", a:
        "<p>Ton code et ton code secret sont toujours affichés sur le téléphone qui les a créés, dans Réglages, sous « Transfert de données » (touche le bouton œil pour voir le code secret). Vérifie d'abord là.</p>" +
        "<p>Sans ce téléphone, le code et le code secret ne peuvent être ni retrouvés ni recréés. Le code secret est stocké chiffré : même nous ne pouvons pas le voir. Entre iPhone utilisant le même compte Apple, iCloud transfère tes données même sans code.</p>" +
        "<p>Après 10 codes secrets erronés d'affilée, la saisie est bloquée pendant 1 heure.</p>" },
      { id: "data-lost", q: "Mes données ont disparu / Je veux revenir en arrière", a:
        "<ul>" +
        "<li><b>Tu as réinitialisé par erreur</b> : pendant 14 jours, utilise « Annuler la réinitialisation » dans « Données » des Réglages. Tu compares les données actuelles et la sauvegarde avant l'échange.</li>" +
        "<li><b>Un transfert a écrasé tes données</b> : pendant 14 jours, utilise « Restaurer les données d'avant le transfert » dans les Réglages.</li>" +
        "<li><b>Réinstallation ou nouvel iPhone</b> : vérifie que tu es connecté à iCloud avec le même compte Apple. Si ta famille partage un compte Apple, le message « D'autres données sont dans iCloud » peut apparaître. Changer ne supprime pas tes données actuelles, et tu peux revenir en arrière pendant 14 jours.</li>" +
        "<li><b>Réinstallation sous Android</b> : si tu as un code de transfert, utilise « Restaurer avec un code ».</li>" +
        "<li><b>Ton animal n'est plus là</b> : il est peut-être simplement parti (voir « Mon animal a disparu »).</li></ul>" +
        "<p>Rien de tout cela ? Écris-nous avec ton code ami (et ton code de transfert si tu en as un) : nous regarderons.</p>" },
      { id: "delete", q: "Comment supprimer mon compte ou mes données ?", a:
        "<p>PawPlanet ne demande aucune inscription. La suppression se fait en deux étapes.</p><ol>" +
        "<li><b>Réinitialiser dans l'app</b> : Réglages → « Données » → « Réinitialiser » efface les données de jeu de ton appareil (animaux, Paw, voyage) et te fait passer à un nouveau compte anonyme. Les données précédentes restent 14 jours sur l'appareil en sauvegarde. Sur iPhone, les clés du compte restent dans le trousseau même si tu supprimes l'app, et une réinstallation te ramène au même compte (les copies iCloud se suppriment dans les réglages iCloud de l'iPhone).</li>" +
        "<li><b>Demander la suppression des données du serveur</b> : pour supprimer les données enregistrées sur notre serveur (nom affiché, pas, code ami, données de transfert, etc.), écris-nous avec ton <b>code ami ou ton code de transfert</b>. Nous les supprimons <b>sous 30 jours</b>. Aucun nom ni e-mail n'est nécessaire.</li></ol>" +
        "<p>Supprimer l'app ne résilie pas le PawPass (voir « Résilier le PawPass »).</p>" }
    ]},
    { id: "other", icon: "🔒", title: "Confidentialité et plus", items: [
      { id: "privacy", q: "Quelles informations sont envoyées, et lesquelles ne le sont pas ?", a:
        "<h4>Non collecté</h4><p>Ni nom, ni e-mail, ni numéro de téléphone, ni position précise (GPS), ni contacts. La connexion est anonyme, sans compte. Nous n'enregistrons ni trajets, ni positions, ni le nom des appareils qui ont compté tes pas, et les pas ne servent jamais à la publicité ou à l'analyse.</p>" +
        "<h4>Envoyé si tu rejoins les classements / amis</h4><p>Ton nom affiché, le nom, l'apparence et le niveau de ton animal, l'apparence de ton jardin, tes badges, tes pas de la semaine, de la semaine précédente, au total et d'aujourd'hui, tes points et places, la ville du jeu où tu te trouves (pas ta position réelle), ton code ami, ton statut PawPass, tes amis, groupes, cadeaux et invitations, et les dates où tu ouvres l'app (supprimées après 400 jours), liés à un identifiant anonyme. Pour garder les classements équitables, uniquement les jours avec un nombre de pas inhabituel et cas semblables, nous pouvons envoyer le total du jour, les pas de ton heure la plus active et les pas saisis à la main.</p>" +
        "<h4>Autres</h4><p>Créer un code de transfert enregistre toutes tes données de jeu (supprimées un an après la dernière mise à jour) ; le formulaire d'avis enregistre ton message avec la version de l'app et du système et le modèle du téléphone. Pour éviter les abus d'invitation, nous vérifions avec Apple/Google que l'app et l'appareil sont authentiques et enregistrons le résultat. Quand tu regardes une pub, des identifiants de l'appareil et des données similaires sont envoyés à la régie (Unity).</p>" +
        "<p>Plus de détails dans la <a class=\"js-privacy\" href=\"privacy.html\">Politique de confidentialité</a> (en anglais).</p>" },
      { id: "notifications", q: "Comment couper les notifications ? / Je ne les reçois pas", a:
        "<p>Nous envoyons des notifications comme des rappels de soins, une alerte quand ton animal est sur le point de partir, et un petit mot si tu n'as pas ouvert l'app depuis longtemps. L'app fonctionne sans.</p>" +
        "<p>Pour les couper, désactive « Notifications » dans « Général » des Réglages de l'app (ou dans les réglages de ton téléphone). Tu ne les reçois pas ? Vérifie que « Notifications » est activé dans l'app et que PawPlanet a le droit d'envoyer des notifications dans les réglages du téléphone.</p>" },
      { id: "android", q: "Existe-t-il une version Android ? Quelles différences ?", a:
        "<p>Oui, sur <a href=\"https://play.google.com/store/apps/details?id=com.pawplanet.app\" rel=\"noopener\">Google Play</a> (Android 8.0 ou ultérieur). La version iPhone est sur l'<a href=\"https://apps.apple.com/app/id6808814090\" rel=\"noopener\">App Store</a> (iOS 16 ou ultérieur).</p>" +
        "<p>Les classements et les amis sont communs à iPhone et Android : tu peux jouer avec des amis sur l'un ou l'autre. Les principales différences :</p><ul>" +
        "<li>Source des pas : Santé et le podomètre de l'iPhone sur iPhone ; Santé Connect et le podomètre du téléphone sous Android.</li>" +
        "<li>Sauvegarde : l'iPhone enregistre automatiquement dans iCloud ; Android ne transfère pas les données tout seul, crée donc un code de transfert avant de changer de téléphone.</li>" +
        "<li>Envoi des pas : sous Android, les pas ne sont lus et envoyés que lorsque l'app est ouverte.</li>" +
        "<li>Achats : App Store sur iPhone, Google Play sous Android. Le PawPass ne passe pas de l'un à l'autre.</li></ul>" },
      { id: "contact", q: "Comment vous contacter ?", a:
        "<p>Utilise « <b>Avis et bugs</b> » dans les Réglages de l'app. Nous ne pouvons généralement pas répondre à chacun, mais nous lisons tous les messages. Les annonces importantes peuvent arriver dans « Nouvelles de l'équipe » de ton Courrier.</p>" +
        "<p>Par e-mail : <a href=\"mailto:yoshitetsugames21@gmail.com\">yoshitetsugames21@gmail.com</a> (en japonais ou en anglais). Avec ton code ami, la version de l'app et le modèle du téléphone, nous vérifions plus vite. Les signalements d'autres joueurs sont aussi acceptés à <a href=\"mailto:yoshitetsugames21+report@gmail.com\">yoshitetsugames21+report@gmail.com</a>.</p>" }
    ]}
  ]
};
</script>
<script>
(function () {
  var LANGS = ["ja","en","zh-Hans","zh-Hant","ko","es","de","fr"];
  var STORE_KEY = "pp_site_lang";   // トップページ（index.html）と同じ鍵＝選んだ言語を共有
  function norm(tag) {
    var l = (tag || "").toLowerCase();
    if (l.indexOf("ja") === 0) return "ja";
    if (l.indexOf("zh") === 0) return /hant|tw|hk|mo/.test(l) ? "zh-Hant" : "zh-Hans";
    if (l.indexOf("en") === 0) return "en";
    if (l.indexOf("ko") === 0) return "ko";
    if (l.indexOf("es") === 0) return "es";
    if (l.indexOf("de") === 0) return "de";
    if (l.indexOf("fr") === 0) return "fr";
    return null;
  }
  function pickLang() {
    try { var q = new URLSearchParams(location.search).get("lang"); var n = norm(q); if (n && T[n]) return n; } catch (e) {}
    try { var s = localStorage.getItem(STORE_KEY); if (s && T[s]) return s; } catch (e) {}
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "ja"];
    for (var i = 0; i < list.length; i++) { var m = norm(list[i]); if (m && T[m]) return m; }
    return "en";
  }

  var $ = function (id) { return document.getElementById(id); };
  var LANG = pickLang();
  var openIds = {};

  // フランス語：? ! : ; » の前と « の後ろは改行しない空白に（index.html と同じ扱い）
  function frStr(s) { return LANG === "fr" ? s.replace(/ ([?!:;»])/g, "\u00a0$1").replace(/« /g, "«\u00a0") : s; }
  function frNodes(node) {
    if (LANG !== "fr") return;
    if (node.nodeType === 3) node.nodeValue = frStr(node.nodeValue);
    else for (var i = 0; i < node.childNodes.length; i++) frNodes(node.childNodes[i]);
  }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  function render(lang) {
    LANG = lang;
    var d = T[lang] || T.en;
    var u = {}; for (var key in d.ui) u[key] = frStr(d.ui[key]);
    document.documentElement.lang = lang;
    document.title = u.title;
    $("h1").textContent = u.h1;
    $("sub").textContent = u.sub;
    $("lede").textContent = u.lede;
    $("q").setAttribute("placeholder", u.search);
    $("q").setAttribute("aria-label", u.search);
    $("cH").textContent = u.cH;
    $("cNote").textContent = u.cNote;
    $("cApp").textContent = u.cApp;
    $("nohit").textContent = u.nohit;
    $("updated").textContent = u.updated;
    var privHref = lang === "ja" ? "privacy.html" : "privacy.html?lang=en";   // ポリシーは日本語・英語の2つ
    $("privacyLink").textContent = u.privacy;
    $("privacyLink").setAttribute("href", privHref);

    var toc = $("toc"), faq = $("faq");
    toc.innerHTML = ""; faq.innerHTML = "";
    d.cats.forEach(function (c) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#cat-" + c.id; a.textContent = c.icon + " " + frStr(c.title);
      li.appendChild(a); toc.appendChild(li);

      var sec = document.createElement("section");
      sec.className = "cat"; sec.id = "cat-" + c.id;
      var h = document.createElement("h2");
      h.innerHTML = "<span aria-hidden=\"true\">" + c.icon + "</span>";
      h.appendChild(document.createTextNode(frStr(c.title)));
      sec.appendChild(h);
      var box = document.createElement("div"); box.className = "faq";
      c.items.forEach(function (it) {
        var det = document.createElement("details");
        det.id = it.id;
        var sum = document.createElement("summary");
        sum.innerHTML = "<span class=\"mk\">Q.</span>";
        var qs = document.createElement("span"); qs.className = "qt"; qs.textContent = frStr(it.q);
        sum.appendChild(qs);
        var ans = document.createElement("div"); ans.className = "ans";
        ans.innerHTML = it.a;
        frNodes(ans);
        // 1.6.4 の段落は公開まで出さない
        var v = ans.querySelectorAll("[v164]");
        for (var i = 0; i < v.length; i++) if (!SHOW_164) v[i].parentNode.removeChild(v[i]);
        var pl = ans.querySelectorAll("a.js-privacy");
        for (var j = 0; j < pl.length; j++) pl[j].setAttribute("href", privHref);
        det.appendChild(sum); det.appendChild(ans);
        det.dataset.text = (it.q + " " + ans.textContent).toLowerCase();
        det.dataset.html = ans.innerHTML;
        if (openIds[it.id]) det.open = true;
        det.addEventListener("toggle", function () { if (det.open) openIds[it.id] = true; else delete openIds[it.id]; });
        box.appendChild(det);
      });
      sec.appendChild(box);
      faq.appendChild(sec);
    });

    var bs = document.querySelectorAll("#langs button");
    for (var k = 0; k < bs.length; k++) bs[k].setAttribute("aria-pressed", bs[k].getAttribute("data-l") === lang ? "true" : "false");
    filter();
  }

  // 検索：質問と答えの文字で絞り込み、当たった言葉に印を付けて開く
  function highlight(node, re) {
    if (node.nodeType === 3) {
      var t = node.nodeValue; if (!re.test(t)) return; re.lastIndex = 0;
      var frag = document.createDocumentFragment(), last = 0, m;
      while ((m = re.exec(t))) {
        frag.appendChild(document.createTextNode(t.slice(last, m.index)));
        var mk = document.createElement("mark"); mk.textContent = m[0]; frag.appendChild(mk);
        last = m.index + m[0].length;
        if (m[0].length === 0) re.lastIndex++;
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === 1 && node.tagName !== "MARK") {
      var kids = Array.prototype.slice.call(node.childNodes);
      for (var i = 0; i < kids.length; i++) highlight(kids[i], re);
    }
  }
  function filter() {
    var raw = ($("q").value || "").trim().toLowerCase();
    var words = raw.split(/\s+/).filter(Boolean);
    var total = 0;
    var secs = document.querySelectorAll("section.cat");
    for (var s = 0; s < secs.length; s++) {
      var dets = secs[s].querySelectorAll("details"), shown = 0;
      for (var i = 0; i < dets.length; i++) {
        var det = dets[i], ans = det.querySelector(".ans"), qt = det.querySelector(".qt");
        ans.innerHTML = det.dataset.html;
        qt.textContent = qt.textContent;   // 印を外す
        var ok = words.every(function (w) { return det.dataset.text.indexOf(w) !== -1; });
        det.hidden = !ok;
        if (ok) { shown++; total++; }
        if (ok && words.length) {
          var re = new RegExp(words.map(esc).join("|"), "gi");
          highlight(ans, re); re.lastIndex = 0; highlight(qt, re);
          det.open = true;
        }
      }
      secs[s].hidden = shown === 0;
    }
    $("toc").parentNode.hidden = words.length > 0;
    $("hits").textContent = words.length ? T[LANG].ui.hits.replace("%n", total) : "";
    $("nohit").hidden = !(words.length && total === 0);
  }

  $("q").addEventListener("input", filter);
  $("langs").addEventListener("click", function (e) {
    var l = e.target && e.target.getAttribute && e.target.getAttribute("data-l");
    if (l && T[l]) { try { localStorage.setItem(STORE_KEY, l); } catch (err) {} render(l); }
  });

  render(LANG);

  // #質問ID で開いてその質問へ（例：support.html#new-phone）
  function openHash() {
    var id = decodeURIComponent((location.hash || "").slice(1));
    var el = id && document.getElementById(id);
    if (el && el.tagName === "DETAILS") { el.open = true; openIds[id] = true; el.scrollIntoView(); }
  }
  window.addEventListener("hashchange", openHash);
  openHash();
})();
</script>
</body>
</html>
