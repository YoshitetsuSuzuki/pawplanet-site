<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友だちからのあけおめ🎍 — PawPlanet</title>
<meta name="description" content="あけましておめでとう！ 今年もいっしょに歩こう。歩いて育てる、世界一周ペット PawPlanet（iPhone / Android）">
<!-- 1.6.6 あけおめカード（設計 §4.5）：LINE・X などのプレビュー用の入口。中身は /get/ と同じで、検査した引数（c・e）に ny=1 を付けて移る。
     プレビューの取得（JS を動かさない）はこのページの og を読む。画像は web/get/img/og_ny.png（1200×630）。 -->
<meta property="og:title" content="あけましておめでとう🎍 — PawPlanet">
<meta property="og:description" content="今年もいっしょに歩こう。歩いて育てる、世界一周ペット。iPhone / Android 対応の無料アプリ。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PawPlanet">
<meta property="og:image" content="https://pawplanet.01-infinity.com/get/img/og_ny.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PawPlanet — あけましておめでとう。今年もいっしょに歩こう">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin">
<script>
  // /get/ny/?c=XXXX&e=1 → /get/?c=XXXX&e=1&ny=1。1.6.7：グループにも誘うカードは /get/ny/?c=XXXX&e=1&g=GGGGGG&ny=1 → /get/?c=XXXX&e=1&g=GGGGGG&ny=1（c・e・g・ny の順＝アプリのリンクと同じ）。
  // 1.6.6 点検 W-7：移る先はパスから組み立てない（/get/ny/index で同じ URL を読み直し続ける・//get/ny/ で //get/ へ移る、を防ぐ）。
  //   旧 URL（…github.io/pawplanet/get/ny/）だけ /pawplanet を残し、それ以外はいつも /get/。
  //   引数は検査したものだけを付け直す（c＝8文字のフレンドコード・e=1・g＝6文字のグループコード・ny=1）。#以降は付けない。
  (function () {
    var q = location.search || "";
    var m = /[?&]c=([^&#]*)/.exec(q), c = "";
    if (m) { try { c = decodeURIComponent(m[1]); } catch (e) { c = ""; } }
    c = c.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-HJ-NP-Z2-9]{8}$/.test(c)) c = "";
    var egg = !!c && /[?&]e=1(?:[&#]|$)/.test(q);
    // 1.6.7：グループのコード（/get/ と同じ規則＝6文字・同じ文字種）。無効なら付けない
    var gm = /[?&]g=([^&#]*)/.exec(q), g = "";
    if (gm) { try { g = decodeURIComponent(gm[1]); } catch (e) { g = ""; } }
    g = g.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(g)) g = "";
    // 1.7.1 招待の名前＋ペット：n（招待用の名前）・pn（ペットの名前）・p（ペットの種類の鍵）も /get/ へ引き継ぐ（設計 2026-11-10「リンクの形」）。
    //   /get/ と同じ決まりで掃除してから付け直す（制御文字・< >・向きの記号を除く・最大12文字・空なら付けない）。n が無ければ pn・p も付けない。
    //   p は形（英小文字・数字・_）だけ見る。公開済みの種類かどうかは /get/ の PET_KEYS が決める。順番は既存の引数のあと（既存の形は変えない）。
    function nm(name) {
      var r = new RegExp("[?&]" + name + "=([^&#]*)").exec(q), s = "";
      if (r) { try { s = decodeURIComponent(r[1].replace(/\+/g, " ")); } catch (e) { s = ""; } }
      s = s.replace(/[\t\n\v\f\r\u2028\u2029]/g, " ").replace(/[\u0000-\u001F\u007F-\u009F]/g, "").replace(/[\u200B\u200E\u200F\u202A-\u202E\u2066-\u2069\u061C\uFEFF]/g, "")
           .replace(/[<>]/g, "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "");
      var a = Array.from ? Array.from(s) : s.split("");
      if (a.length > 12) s = a.slice(0, 12).join("").replace(/\s+$/, "");
      return s;
    }
    var n = nm("n"), pn = n ? nm("pn") : "", pm = /[?&]p=([a-z0-9_]{1,32})(?:[&#]|$)/.exec(q), p = (n && pm) ? pm[1] : "";
    var who = (n ? "&n=" + encodeURIComponent(n) : "") + (pn ? "&pn=" + encodeURIComponent(pn) : "") + (p ? "&p=" + p : "");
    var base = /^\/pawplanet\/get\/ny(?:\/(?:index(?:\.html)?)?)?$/.test(location.pathname) ? "/pawplanet/get/" : "/get/";
    var to = base + "?" + (c ? "c=" + c + "&" : "") + (egg ? "e=1&" : "") + (g ? "g=" + g + "&" : "") + "ny=1" + who;
    window.PAW_NY_TARGET = to;   // 試験用（移る先）
    location.replace(to);
  })();
</script>
<style>
  :root{--bg:#FFF7EE;--ink:#2E2A27;color-scheme:light}
  /* 2026-11：/get/ と同じく、OS がダークでも明るいまま（/get/ へ移る前の一瞬だけ黒くならないように） */
  body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:16px}
  a{color:inherit}
</style>
</head>
<body>
  <p><a id="go" href="../?ny=1">PawPlanet 🎍</a></p>
  <script>if (window.PAW_NY_TARGET) document.getElementById("go").href = window.PAW_NY_TARGET;   // 予備のリンクにもコードを残す</script>
</body>
</html>
