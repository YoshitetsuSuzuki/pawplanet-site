<!-- 1.6.6 点検 W-7：コード付きの URL を検索に載せない・ストアへ移るときに引数（コード）を送らない -->
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin">
<script>
  // ・招待コード付き（?c=XXXXXXXX）：コードを大きく見せて「コピーしてストアへ」「アプリで開く」を出す（自動では飛ばない）。
  // ・コード無し：端末を見てそのままストアへ（iPhone/iPad → App Store、Android → Google Play、PC はボタン表示）。
  var IOS = "https://apps.apple.com/app/id6808814090";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.pawplanet.app";
  // Google Play で公開されるまでは false（Android の人には「もうすぐ公開」を出し、ストアへは送らない）。公開されたら true に。
  var ANDROID_LIVE = true;
  // iPhone で招待リンクそのものをコピーするか。★iOS 1.6.6 の公開（App Store で配信中）を確かめてから true に★
  //   false のあいだ、iPhone は今までどおりコードだけ（グループ＋招待は1行 gcopy・グループだけは1行 gocopy）をコピーする。
  //   iOS 1.6.5 のはじめかたの入力欄は、長押しで直接貼ったリンクを読めない（貼るボタンなら読める）ため。
  //   Android・PC は今からリンクをコピーする（Android 1.6.5 はどの欄でもリンクから読める）。
  var IOS_LINK_COPY = false;
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  // 引数を1つ取り出す（1.6.6 点検 W-4：?c=%E0 のような壊れた % で decodeURIComponent が止まり、ストアのボタンが
  //   href="undefined" になっていた → 失敗したら空の文字。検査は呼ぶ側の正規表現）
  function qp(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search || "");
    if (!m) return "";
    try { return decodeURIComponent(m[1]); } catch (e) { return ""; }
  }
  var CODE = (function () {
    var c = qp("c").toUpperCase().replace(/[^A-Z0-9]/g, "");
    return /^[A-HJ-NP-Z2-9]{8}$/.test(c) ? c : "";   // フレンドコードの形（8文字・紛らわしい0/O/1/I なし）だけ受け付ける
  })();
  // グループ招待（?g=XXXXXX）：グループコード（6文字・同じ文字種）。
  //   1.6.4：?g=G&c=C（グループの招待に送った人の招待コードつき）は、グループの見た目のまま、リファラにも両方を入れる。
  var GROUP = (function () {
    var g = qp("g").toUpperCase().replace(/[^A-Z0-9]/g, "");
    return /^[A-HJ-NP-Z2-9]{6}$/.test(g) ? g : "";
  })();
  // 1.6.4 おすそわけたまご（?c=CODE&e=1）：見出しだけ「たまごのおすそわけ」にする（名前はページに出さない・コードから名前を引かない）
  // 1.6.6 あけおめカード（?ny=1・設計 §4.5）：見出しを「友だちからのあけおめ🎍」にして、お正月の見た目にする。
  //   ?c=&e=1&ny=1 → あけおめ＋おすそわけたまご（中身は今までどおり）／?c=&ny=1 → あけおめ＋ふつうの招待／?ny=1 → あけおめ＋入手ボタンだけ。
  // 1.6.7：グループがあっても ny=1 を見て、お正月の見た目のまま「グループに誘われています」の一行を足す（グループ名・人の名前は出さない）。
  //   ・?g=G&ny=1 → グループの案内／?c=&e=1&g=&ny=1 → たまごの案内を残す（コードはフレンドコードを大きく）／?c=&g=&ny=1 → グループの案内。
  //   ・ny=1 の無いグループの招待（?g=・?g=&c=・e=1 つきでも）は今までどおり（NY=false・グループの見た目）。
  var NY = /[?&]ny=1(?:[&#]|$)/.test(location.search);
  // クリスマス2026 ③（?xm=1）：見出しを「友だちからのクリスマスカード🎄」にして、赤と緑を少しだけ足す。中身（おすそわけたまご・入手ボタン）は今までどおり・ごほうびは足さない。
  //   グループ（?g=）か ny=1 があれば XM は立てない＝そちらの見た目のまま。?xm=1 だけ（コード無し）のスマホは ny=1 と同じく自動では移らずボタンを出す。
  var XM = !GROUP && !NY && /[?&]xm=1(?:[&#]|$)/.test(location.search);
  var EGG = !!CODE && /[?&]e=1(?:[&#]|$)/.test(location.search) && (!GROUP || NY);
  // 見た目：group（?g= だけ・?g=&c=）／egg（?c=&e=1）／invite（?c= だけ）
  var MODE = (NY && EGG) ? "egg" : (GROUP ? "group" : (EGG ? "egg" : (CODE ? "invite" : "")));
  // 1.6.6 点検 W-3：「コピーしてストアへ」でコピーするのは招待リンクそのもの（設計 2026-11-02-invite-one-tap-ios-design.md §A）。
  //   iPhone 1.6.6 のはじめての起動は、リンクらしいもの（.probableWebURL）がコピーされているときだけ「🎁 招待を受け取る」を出す。
  //   ・形は /get/（/get/ny/ はアプリが招待ページと見なさない＝点検 C-3）。ホストは独自ドメインに固定（どちらの Pages で開いても同じ）。
  //   ・グループ＋招待：?g=G&c=C（アプリの共有と同じ形）／招待：?c=C（たまご &e=1・あけおめ &ny=1）。
  //   ・グループだけ（?g=G）はリンクにしない。1.6.7 からコピーするのは言語ごとの1行 gocopy「PawPlanet グループ G」
  //     （下の apply の MEMO_TEXT）＝はじめかたの貼り付けが合図の語からコードを読む（iOS groupKeywords・Android extractCodes）。
  //     「グループ」→「コードで参加」の欄は 1.6.6 以前は6文字で切る（1行を貼ると「PawPla」）＝gstep2 は、アプリを持っている人には
  //     「上の6文字を入力」と書く（1.6.7 の欄は貼った1行からコードを取り出す）。
  //   古いアプリ（iOS・Android とも）も、貼った文のリンクの c=／g= からコードを取り出せる。
  var COPY_LINK = "https://pawplanet.01-infinity.com/get/?" + (GROUP ? ("g=" + GROUP + (CODE ? "&c=" + CODE : ""))
                    : ("c=" + CODE + (EGG ? "&e=1" : "") + (NY ? "&ny=1" : "")));
  // 招待コードがあり、iPhone 以外か IOS_LINK_COPY が true のときだけリンク。それ以外は下の apply で MEMO_TEXT（コード）にする。
  var USE_LINK = !!CODE && (!isIOS || IOS_LINK_COPY);
  var COPY_TEXT = USE_LINK ? COPY_LINK : (CODE || GROUP);
  // ── 招待の計測（1.6.3・設計 B4/B5）。公開はよしてつ様の確認後 ──
  // App Store のキャンペーン用プロバイダID（pt）。★よしてつ様が ASC で確認した数字に差し替える★
  //   （App Store Connect →「アナリティクス」→「獲得」→「キャンペーン」→「キャンペーンリンクを生成」で出るリンクの pt=の数字）
  //   数字でないあいだ（PROVIDER_ID_TBD のまま）は pt を付けない＝ ct=invite と mt=8 だけ付く。
  var APP_STORE_PROVIDER_ID = "PROVIDER_ID_TBD";
  // 招待コード（?c=）があるときは、App Store のリンクにも印を付ける。グループだけ（?g=）は App Store は今までどおり（Play のリファラだけ group=）。
  var IOS_LINK = IOS;
  var ANDROID_LINK = ANDROID;
  if (CODE && /^[A-Z0-9]{1,16}$/.test(CODE)) {   // 英大文字と数字だけ（上の CODE の検査に加えて念のため）
    IOS_LINK = IOS + "?" + (/^[0-9]{1,20}$/.test(APP_STORE_PROVIDER_ID) ? "pt=" + APP_STORE_PROVIDER_ID + "&" : "") + "ct=invite&mt=8";
    // Google Play のインストールリファラ：referrer=invite%3D<CODE>（アプリは初回起動で一度だけ読む）
    //   1.6.4：グループの招待（?g=G&c=C）は invite=<CODE>&group=<GROUP>（1.6.3 の Android は invite= だけを読む＝今までどおり招待として動く）
    ANDROID_LINK = ANDROID + "&referrer=" + encodeURIComponent("invite=" + CODE + (GROUP ? "&group=" + GROUP : ""));
  } else if (GROUP) {
    // 1.6.7：グループだけ（?g=G）は group=<GROUP> だけ（アプリは初回起動でグループの参加欄に入れる・招待コードは無し）
    ANDROID_LINK = ANDROID + "&referrer=" + encodeURIComponent("group=" + GROUP);
  }
  // コード無しはストアへ自動で移る。ただし ?ny=1／?xm=1 だけのときは、あいさつを見せるため移らずにボタンを出す。
  if (!CODE && !GROUP && !NY && !XM) {
    if (isIOS) location.replace(IOS);
    else if (isAndroid && ANDROID_LIVE) location.replace(ANDROID);
  }
</script>

  function pickLang() {
    var list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "ja"]);
    for (var i = 0; i < list.length; i++) {
      var l = (list[i] || "").toLowerCase();
      if (l.indexOf("ja") === 0) return "ja";
      if (l.indexOf("zh") === 0) return /hant|tw|hk|mo/.test(l) ? "zh-Hant" : "zh-Hans";
      if (l.indexOf("en") === 0) return "en";
      if (l.indexOf("ko") === 0) return "ko";
      if (l.indexOf("es") === 0) return "es";
      if (l.indexOf("de") === 0) return "de";
      if (l.indexOf("fr") === 0) return "fr";
    }
    return "en";
  }
  var LANG = pickLang();
  // COPY_TEXT（コピーする文字）は上の script で決めた招待リンク（USE_LINK のとき）。MEMO_TEXT はコード
  //   （グループ＋招待は言語ごとの1行 gcopy・グループだけは gocopy）＝コピーできなかったときに見せる文字・USE_LINK でないときにコピーする文字。
  var MEMO_TEXT = CODE || GROUP;
  function apply(lang) {
    LANG = lang;
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = NY ? (t.nyhead + " — PawPlanet") : (XM ? (t.xmhead + " — PawPlanet") : t.title);
    // あけおめ（?ny=1）：見出しを「友だちからのあけおめ🎍」、その下にあいさつ。名前はリンクに無いので出さない
    // クリスマス（?xm=1）：見出しだけ「友だちからのクリスマスカード🎄」（あいさつの行・グループの行は足さない）
    document.getElementById("head").textContent = NY ? t.nyhead : (XM ? t.xmhead : "PawPlanet");
    var ng = document.getElementById("nyGreet");
    ng.hidden = !NY;
    ng.textContent = NY ? t.nygreet : "";
    // 1.6.7：グループにも誘うあけおめは「グループに誘われています」の一行（グループ名・人の名前は出さない＝リンクに無い）
    var nyg = document.getElementById("nyGroup");
    nyg.hidden = !(NY && GROUP);
    nyg.textContent = (NY && GROUP) ? t.nygroup : "";
    var els = document.querySelectorAll("[data-i]");
    for (var i = 0; i < els.length; i++) {
      // 1.6.4：グループ＋招待（?g=&c=）は data-gc → data-g、おすそわけたまご（?c=&e=1）は data-e を先に使う
      var k = (MODE === "group" && CODE && els[i].getAttribute("data-gc")) || (MODE === "group" && els[i].getAttribute("data-g"))
              || (MODE === "egg" && els[i].getAttribute("data-e")) || els[i].getAttribute("data-i");
      els[i].textContent = t[k] || "";
    }
    // 1.6.7：グループだけ（?g=G）は「PawPlanet グループ G」（アプリの合図の語＝iOS groupKeywords・Android extractCodes で読める）
    MEMO_TEXT = (GROUP && CODE) ? t.gcopy.replace("%G", GROUP).replace("%C", CODE) : (GROUP ? t.gocopy.replace("%G", GROUP) : CODE);
    var cl = document.getElementById("copyLine");
    cl.hidden = !(GROUP && CODE);
    cl.textContent = (GROUP && CODE) ? MEMO_TEXT : "";
    // 1.6.7：アプリで開く の飛び先はグループがあれば joingroup＝文もグループ（たまごの案内でもフレンド追加とは書かない）
    if (GROUP) document.getElementById("openApp").textContent = t.gopenApp;
    if (!USE_LINK) COPY_TEXT = MEMO_TEXT;   // iPhone（IOS_LINK_COPY=false）・グループだけ：今までどおり
    var bs = document.querySelectorAll("#langs button");
    for (var j = 0; j < bs.length; j++) bs[j].setAttribute("aria-pressed", bs[j].getAttribute("data-l") === lang ? "true" : "false");
  }
  document.getElementById("langs").addEventListener("click", function (e) {
    var l = e.target && e.target.getAttribute && e.target.getAttribute("data-l");
    if (l && T[l]) apply(l);
  });
  apply(LANG);

  if (NY) document.body.className += " ny";
  if (XM) document.body.className += " xm";
  // ?ny=1／?xm=1 だけ（コード無し）のスマホ：自動では移らないので、その端末のストアのボタンだけを出す（PC は両方）
  if ((NY || XM) && !CODE) {
    if (isIOS) document.getElementById("playBtn").hidden = true;
    else if (isAndroid) document.getElementById("appStoreBtn").hidden = true;
  }
  if (!ANDROID_LIVE) {
    document.getElementById("playBtn").hidden = true;
    document.getElementById("androidSoon").hidden = false;
  }
  // 招待コードがあるときは、PC などで見えるストアのボタンにも同じ印（キャンペーン・リファラ）を付ける
  document.getElementById("appStoreBtn").href = IOS_LINK;
  document.getElementById("playBtn").href = ANDROID_LINK;
  var SHOWN = MODE === "egg" ? CODE : (GROUP || CODE);   // 大きく見せるコード（グループの招待はグループのコード・あけおめのたまごはフレンドコード）
  if (SHOWN) {
    document.getElementById("invite").hidden = false;
    document.getElementById("code").textContent = SHOWN;
    document.getElementById("eggNote").hidden = (MODE !== "egg");
    // 1.6.7：iPhone でグループがあるときは、貼り付けの一言（コピーしたあとアプリの「貼り付け」を押す）
    document.getElementById("pasteHint").hidden = !(isIOS && GROUP);
    // 1.6.6 点検 W-5：特典を書いている見た目（招待・たまご）には条件も出す（グループの見た目は特典を書いていない）
    document.getElementById("cond").hidden = (MODE !== "invite" && MODE !== "egg");
    // アプリで開く：グループ（招待コードつきなら &c=）→ 招待。古いアプリは joingroup の code= だけを読む＝グループには今までどおり入れる
    document.getElementById("openApp").href = GROUP ? ("pawplanet://joingroup?code=" + GROUP + (CODE ? "&c=" + CODE : ""))
                                                     : ("pawplanet://addfriend?code=" + CODE);
    // スマホではストアのボタンを「コピーしてストアへ」1つにまとめる（PC は両方のストアを残す）
    if (isIOS || isAndroid) document.getElementById("stores").hidden = true;
    if (isAndroid && !ANDROID_LIVE) {
      // Android 版の公開前：コードは見せるが、ストアのボタンの代わりに「もうすぐ公開」を出す
      document.getElementById("copyGo").hidden = true;
      document.getElementById("stores").hidden = false;
    }
    var store = isIOS ? IOS_LINK : (isAndroid && ANDROID_LIVE ? ANDROID_LINK : null);
    document.getElementById("copyGo").addEventListener("click", function () {
      var done = function (ok) {
        document.getElementById("toast").textContent = ok ? (T[LANG].copied + COPY_TEXT) : (T[LANG].memo + MEMO_TEXT);
        if (store) setTimeout(function () { location.href = store; }, ok ? 600 : 1800);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(COPY_TEXT).then(function () { done(true); }, function () { done(false); });
        } else { done(false); }
      } catch (e) { done(false); }
    });
  }
